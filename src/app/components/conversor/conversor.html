<header>
  <nav class="navbar navbar-expand-lg bg-body-tertiary py-3">
    <div class="container-fluid">
      <a class="navbar-brand fs-3 ps-3 fw-bold" href="#">Grand Tour GT</a>
      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse" data-bs-target="#navbarToggler">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarToggler">
        <ul class="navbar-nav ms-auto fs-5 gap-2">
          <li class="nav-item"><a href="/" class="nav-link px-3 py-2">Películas</a></li>
          <li class="nav-item"><a href="/autos" class="nav-link px-3 py-2">Autos</a></li>
          <li class="nav-item"><a href="/conversor" class="nav-link px-3 py-2">Conversor</a></li>
          <li class="nav-item"><a href="/tts" class="nav-link px-3 py-2">Text to Speech</a></li>
          <li class="nav-item"><a href="/clima" class="nav-link px-3 py-2">Clima</a></li>
        </ul>
      </div>
    </div>
  </nav>
</header>

<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h2 class="mb-4 fw-bold">💱 Conversor de Monedas</h2>
    <div class="card shadow-sm p-4">

      <div class="mb-3">
        <label class="form-label fw-semibold">Monto</label>
        <input type="number" class="form-control" [(ngModel)]="monto" min="0">
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label fw-semibold">Moneda origen</label>
          <select class="form-select" [(ngModel)]="desde">
            <option *ngFor="let m of monedas" [value]="m">{{ m }}</option>
          </select>
        </div>
        <div class="col-6">
          <label class="form-label fw-semibold">Moneda destino</label>
          <select class="form-select" [(ngModel)]="hasta">
            <option *ngFor="let m of monedas" [value]="m">{{ m }}</option>
          </select>
        </div>
      </div>

      <button class="btn btn-primary w-100" (click)="convertir()" [disabled]="cargando">
        <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
        Convertir
      </button>

      <div *ngIf="resultado !== null" class="alert alert-success mt-4 text-center fs-5">
        {{ monto }} {{ desde }} = <strong>{{ resultado | number:'1.2-2' }} {{ hasta }}</strong>
      </div>
    </div>
  </div>
</div>

<footer class="bg-body-tertiary py-4 mt-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-4 text-center">
        <h5 class="mb-3 fw-bold">Síguenos</h5>
        <div class="d-flex justify-content-center gap-3 fs-3">
          <a href="#" class="text-body" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
          <a href="https://www.instagram.com/nacho367_/" class="text-body" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
          <a href="#" class="text-body" aria-label="Twitter"><i class="bi bi-twitter"></i></a>
        </div>
      </div>
    </div>
    <hr class="my-3">
    <div class="text-center small opacity-75">© 2026 Grand Tour GT - Todos los derechos reservados</div>
  </div>
</footer>
