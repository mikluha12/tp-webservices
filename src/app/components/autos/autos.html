<h2 class="mb-4 fw-bold">🚗 Marcas de Autos</h2>

<div *ngIf="cargando" class="text-center py-5">
  <div class="spinner-border" role="status"></div>
</div>

<div class="container py-5">
  <div class="row g-4 justify-content-center">
    <div class="col-12 col-md-6 col-lg-4" *ngFor="let marca of marcas">
      <div class="card h-100 bg-body-secondary text-center p-3" 
           style="cursor:pointer" (click)="verModelos(marca)">
        <div class="card-body d-flex flex-column align-items-center justify-content-center py-4">
          <i class="bi bi-car-front-fill" style="font-size:2.5rem; color:var(--bs-primary)"></i>
          <h3 class="mt-2">{{ marca.name }}</h3>
          <p class="text-muted small">{{ marca.country ?? 'Ver modelos' }}</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal Bootstrap -->
<div class="modal fade" id="modalModelos" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Modelos — {{ marcaSeleccionada }}</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div *ngIf="cargandoModelos" class="text-center py-3">
          <div class="spinner-border" role="status"></div>
        </div>
        <ul class="list-group" *ngIf="!cargandoModelos">
          <li class="list-group-item" *ngFor="let modelo of modelos">
            {{ modelo.name }}
          </li>
        </ul>
        <p *ngIf="!cargandoModelos && modelos.length === 0" class="text-muted text-center">
          No se encontraron modelos.
        </p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
